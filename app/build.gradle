apply plugin: 'com.android.application'
android {
    namespace 'com.aiextminipro'
    compileSdk 34
    buildToolsVersion "34.0.0"
    defaultConfig {
        applicationId "com.aiextminipro"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "2.0"
        buildConfigField "String", "API_URL", "\"https://openrouter.ai/api/v1/chat/completions\""
        buildConfigField "String", "DEFAULT_MODEL", "\"meta-llama/llama-3.3-70b-instruct:free\""
        buildConfigField "double", "TEMPERATURE", "0.3"
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android.txt') }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'com.github.bumptech.glide:glide:4.15.0'
    implementation 'io.noties.markwon:markwon:4.6.2'
    implementation 'androidx.preference:preference:1.2.0'
}
